name: macOS Remote Desktop

on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Configure Screen Sharing
      run: |
        # Enable Remote Management using the built-in system administrator tool
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
          -activate \
          -configure -access -on \
          -privs -all \
          -clientopts -setvncpasswd -vncpasswd "Password123" \
          -restart -agent
        
    - name: Start ngrok Tunnel
      env:
        NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
      run: |
        # Install ngrok using Homebrew
        brew install --cask ngrok
        
        # Add the authentication token
        ngrok config add-authtoken $NGROK_AUTHTOKEN
        
        # Start a TCP tunnel on the system's VNC port
        ngrok tcp 5900
