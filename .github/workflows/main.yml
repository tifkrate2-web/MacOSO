name: macOS Remote Desktop

on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Configure Screen Sharing
      run: |
        # Use sysadminctl to securely set the password for the current runner user
        sudo sysadminctl -password "Password123" -user "$USER"
        
        # Turn on Screen Sharing / VNC service
        sudo launchctl kickstart -k system/com.apple.screensharing
        
    - name: Start ngrok Tunnel
      env:
        NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
      run: |
        # Install ngrok using Homebrew
        brew install --cask ngrok
        
        # Add the authentication token
        ngrok config add-authtoken $NGROK_AUTHTOKEN
        
        # Start a TCP tunnel on the standard macOS Screen Sharing port
        ngrok tcp 5900
