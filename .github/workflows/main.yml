name: macOS Remote Terminal (Termius)

on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Launch Termius Tunnel via Serveo
      run: |
        # Turn on the native macOS Remote Login (SSH Server)
        sudo systemsetup -setremotelogin on
        
        # Explicitly set the password for your runner account
        sudo sysadminctl -password "Password123" -user "$USER"
        
        # Launch a free tunnel routing local port 22 out to serveo.net
        ssh -o StrictHostKeyChecking=no -R 0:localhost:22 serveo.net
        
