name: macOS Remote Terminal (Tmate)

on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Fix Network DNS & Launch Tmate
      run: |
        # Dynamically find the active network interface and switch it to Google DNS
        INTERFACE=$(networksetup -listallnetworkservices | grep -v '*' | head -n 1)
        sudo networksetup -setdnsservers "$INTERFACE" 8.8.8.8 8.8.4.4
        
        # Flush the system DNS cache to apply changes immediately
        sudo killall -HUP mDNSResponder
        
        # Install tmate natively
        brew install tmate
        
        # Launch tmate to print your Termius connection keys
        tmate -F
        
