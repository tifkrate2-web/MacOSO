name: macOS Remote Terminal (Termius)

on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Launch Unlimited Termius Tunnel
      run: |
        # Turn on native macOS SSH server service
        sudo systemsetup -setremotelogin on
        
        # Reset system password for the runner account
        sudo sysadminctl -password "Password123" -user "$USER"
        
        # Start a continuous tunnel via localhost.run on port 22
        ssh -o StrictHostKeyChecking=no -R 80:localhost:22 plan@localhost.run
        
